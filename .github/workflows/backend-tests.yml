name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "orderflow-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "orderflow-backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orderflow-backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Overrides the local-trust connection string in .env.test — the
      # Postgres service container needs the standard user/password.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderflow_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orderflow-backend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test
